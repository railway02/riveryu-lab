name: Verify native Fengjian page

on:
  push:
    branches: [feat/fengjian-page-20261008]
    paths: [.github/workflows/verify-fengjian-20261008.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check production URLs, byte integrity, and a clean Hugo build
        run: |
          python3 -u - <<'PY'
          import hashlib
          import io
          import json
          import pathlib
          import re
          import subprocess
          import tarfile
          import urllib.request
          from html.parser import HTMLParser

          expected = '766ea6535558924d3760fd5737e70e5c777f7a6a662ace92f3bb167e2c0a2f36'
          commit = 'e460f1cea603561e8d1d5b2b82f59354fdae83b1'
          def get(url, limit=160000000):
              req = urllib.request.Request(url, headers={'User-Agent': 'FengjianPageVerification/1.0', 'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.status, response.geturl(), response.read(limit)

          homepage = ''
          for url in ['https://www.ruyaohui.com/', 'https://www.ruyaohui.com/fengjian/', 'https://ruyaohui.com/fengjian/']:
              status, final_url, body = get(url, 2000000)
              text = body.decode('utf-8')
              title = re.search(r'<title>(.*?)</title>', text, re.S)
              digest = hashlib.sha256(body).hexdigest()
              print(json.dumps({'url': url, 'status': status, 'final_url': final_url, 'title': title.group(1) if title else None, 'bytes': len(body), 'sha256': digest}, ensure_ascii=False), flush=True)
              assert status == 200
              if '/fengjian/' in url:
                  assert digest == expected, 'Live page does not match the committed standalone file'
                  assert '.vercel.app' not in final_url
                  assert 'noindex, nofollow, noarchive' in text
              else:
                  homepage = text
                  assert 'RiverYu' in text
                  assert '<title>冯健' not in text

          class MetaParser(HTMLParser):
              version = None
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == 'meta' and data.get('name') == 'generator':
                      match = re.search(r'Hugo (\d+\.\d+\.\d+)', data.get('content', ''))
                      if match:
                          self.version = match.group(1)
          parser = MetaParser()
          parser.feed(homepage)
          release_url = ('https://api.github.com/repos/gohugoio/hugo/releases/tags/v' + parser.version) if parser.version else 'https://api.github.com/repos/gohugoio/hugo/releases/latest'
          release = json.loads(get(release_url, 3000000)[2])
          version = release['tag_name'].lstrip('v')
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          filename = 'hugo_extended_' + version + '_linux-amd64.tar.gz'
          asset = next(a for a in release['assets'] if a['name'] == filename)
          checksum_asset = next(a for a in release['assets'] if a['name'].endswith('_checksums.txt'))
          checksum_lines = get(checksum_asset['browser_download_url'], 2000000)[2].decode().splitlines()
          checksum = next(line.split()[0] for line in checksum_lines if line.split()[-1].lstrip('*') == filename)
          archive = get(asset['browser_download_url'])[2]
          assert hashlib.sha256(archive).hexdigest() == checksum, 'Hugo distribution checksum mismatch'
          executable = pathlib.Path('/tmp/fengjian-hugo')
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
              member = tar.getmember('hugo')
              assert member.isfile()
              executable.write_bytes(tar.extractfile(member).read())
          executable.chmod(0o755)
          print('Verified official Hugo', version, flush=True)
          repo = '/tmp/fengjian-site-check'
          subprocess.run(['git', 'clone', '--depth', '1', '--branch', 'main', 'https://github.com/railway02/riveryu-lab.git', repo], check=True)
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=repo, text=True).strip()
          assert actual == commit, 'Main changed during verification; do not validate a different revision'
          subprocess.run(['git', 'submodule', 'update', '--init', '--recursive', '--depth', '1'], cwd=repo, check=True)
          subprocess.run([str(executable), '--minify', '--destination', '/tmp/fengjian-built-site'], cwd=repo, check=True)
          built = pathlib.Path('/tmp/fengjian-built-site/fengjian/index.html').read_bytes()
          assert hashlib.sha256(built).hexdigest() == expected
          assert pathlib.Path('/tmp/fengjian-built-site/index.html').stat().st_size > 100
          print('PASS: hugo --minify, native static file integrity, both public URL variants, and preserved home page.', flush=True)
          PY
