name: Import approved Fengjian page

on:
  push:
    branches: [feat/fengjian-page-20261008]
    paths: [.github/workflows/import-fengjian-20261008.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing page and add only the standalone static file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          expected = '952eb1a683901d37d7fdfa78ec54cc8a3b95bb6f9c6d9f83e12fa23f2af4294c'
          sources = [
              'https://fengjian-love.vercel.app/',
              'https://fengjian-love-fvq2fab7i-railways-projects-ee67bcce.vercel.app/',
          ]
          page = None
          for source in sources:
              try:
                  request = urllib.request.Request(source, headers={'User-Agent': 'FengjianPageMigration/1.0'})
                  with urllib.request.urlopen(request, timeout=40) as response:
                      candidate = response.read(2000000).strip()
                      print('Source HTTP:', response.status, 'bytes:', len(candidate))
                  digest = hashlib.sha256(candidate).hexdigest()
                  if digest != expected:
                      raise ValueError('Source hash mismatch: ' + digest)
                  page = candidate.decode('utf-8')
                  break
              except Exception as error:
                  print('Source verification failed:', source, str(error))
          if page is None:
              raise SystemExit('No verified source was available. No repository content changed.')
          assert page.startswith('<!DOCTYPE html>') and page.endswith('</html>')
          assert '<title>冯健，偏爱是你。</title>' in page
          page = page.replace('<head>', '<head>\n  <meta name="robots" content="noindex, nofollow, noarchive">', 1)
          payload = (page + '\n').encode('utf-8')
          print('Verified standalone HTML; SHA256:', hashlib.sha256(payload).hexdigest())

          api = 'https://api.github.com/repos/railway02/riveryu-lab/contents/static/fengjian/index.html'
          branch = 'feat/fengjian-page-20261008'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'FengjianPageMigration/1.0',
              'Content-Type': 'application/json',
          }
          try:
              with urllib.request.urlopen(urllib.request.Request(api + '?ref=' + branch, headers=headers), timeout=30):
                  raise SystemExit('Destination already exists; refusing to overwrite it.')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          data = json.dumps({
              'message': 'Add standalone Fengjian love page at /fengjian/',
              'content': base64.b64encode(payload).decode('ascii'),
              'branch': branch,
          }).encode('utf-8')
          with urllib.request.urlopen(urllib.request.Request(api, data=data, headers=headers, method='PUT'), timeout=60) as response:
              result = json.load(response)
          print('Created:', result['content']['path'])
          print('Commit:', result['commit']['sha'])

          for url in ['https://www.ruyaohui.com/', 'https://www.ruyaohui.com/fengjian/']:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      html = response.read(2000000).decode('utf-8')
                      title = re.search(r'<title>(.*?)</title>', html, re.S)
                      print('HTTP check:', url, response.status, 'title:', title.group(1) if title else '(none)')
              except Exception as error:
                  print('HTTP check incomplete:', url, str(error))
          PY
