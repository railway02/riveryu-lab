<span class="post-meta__item" title="{{ .Date }}">
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
</span>
{{- if (.Param "ShowReadingTime") }}
<span class="post-meta__item">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
  <span>{{ .ReadingTime }} min</span>
</span>
{{- end }}
<span class="post-meta__item">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3Z"/></svg>
  <span>{{ .Language.LanguageName | default "中文" }}</span>
</span>
{{- with .Params.tags }}
<span class="post-meta__item post-meta__tags">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3 8 21M16 3l-2 18M4 9h16M3 15h16"/></svg>
  <span>
    {{- range $index, $tag := . -}}
      {{- if $index }} / {{ end -}}
      <a href="{{ (printf "/tags/%s/" ($tag | urlize)) | absLangURL }}">{{ $tag }}</a>
    {{- end -}}
  </span>
</span>
{{- end }}
