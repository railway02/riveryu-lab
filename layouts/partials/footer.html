{{- if not (.Param "hideFooter") -}}
<footer class="footer">
  <div class="footer-meta">
    <div>{{ site.Copyright | markdownify }}</div>
    <a class="footer-rss" href="{{ "/index.xml" | absLangURL }}" aria-label="RSS feed">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="19" r="1.5"/><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/></svg>
    </a>
  </div>
  <section class="footer-card" aria-hidden="true">
    <span>RiverYu</span>
  </section>
</footer>
{{- end -}}
{{- if not site.Params.disableScrollToTop -}}
<a class="top-link" id="top-link" href="#top" aria-label="Back to top">
  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 12.5 10 6l6 6.5" /></svg>
</a>
{{- end -}}
{{- partial "extend_footer.html" . -}}
