baseURL: "https://www.ruyaohui.com/"
title: "RiverYu's Home"
languageCode: "zh-cn"
hasCJKLanguage: true
theme: "PaperMod"

# -----------------------------------------------------------------------------
# URL & Permalink policy
# -----------------------------------------------------------------------------
permalinks:
  projects: /projects/:contentbasename/
  notes: /notes/:contentbasename/
  posts: /posts/:contentbasename/

# -----------------------------------------------------------------------------
# Build & deploy
# -----------------------------------------------------------------------------
enableRobotsTXT: true
buildDrafts: false
buildFuture: false

build:
  writeStats: true

minify:
  disableXML: false
  minifyOutput: true

# -----------------------------------------------------------------------------
# Output formats
# -----------------------------------------------------------------------------
outputs:
  home:
    - HTML
    - RSS
    - JSON
    - Graph

outputFormats:
  Graph:
    mediaType: application/json
    baseName: graph
    isPlainText: true
    notAlternative: true

# -----------------------------------------------------------------------------
# Site-wide metadata
# -----------------------------------------------------------------------------
copyright: >
  &copy; 2026 RiverYu's Home ·
  <span class="footer-motto">Per aspera ad astra</span>

# -----------------------------------------------------------------------------
# Theme parameters
# -----------------------------------------------------------------------------
params:
  env: production
  description: "Undergraduate CS Student | AI & 3D Editing, Deep Learning"
  author: "Yaohui Ru (RiverYu)"

  # SEO & feeds
  images: ["images/cover.png"]
  sitemap:
    changefreq: weekly
    priority: 0.6

  # ✅ 修复：合并后的 Assets 配置 (性能 + 图标)
  assets:
    disableHLJS: true            # Use Hugo Chroma (CSS only)
    disableFingerprinting: false
    disableScrollBarStyle: true
    favicon: /river-logo.svg
    favicon16x16: /river-logo.svg
    favicon32x32: /river-logo.svg
    apple_touch_icon: /river-logo.svg
    theme_color: "#FCFCFD"
    msapplication_TileColor: "#FCFCFD"

  # Content behavior
  math: true
  mainSections:
    - projects
    - notes
    - posts
  ShowToc: true
  TocOpen: true

  # UI toggles
  defaultTheme: light
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false       # Custom render hook provides the source-matched copy control
  ShowWordCount: false

# -----------------------------------------------------------------------------
# Menu architecture
# -----------------------------------------------------------------------------
menu:
  main:
    - identifier: projects
      name: "Projects"
      url: /projects/
      weight: 10

    - identifier: blog
      name: "Blog"
      url: /blog/
      weight: 20

    - identifier: river
      name: "The River"
      url: /archives/
      weight: 30

    - identifier: search
      name: "Search"
      url: /search/
      weight: 40

    - identifier: about
      name: "About"
      url: /about/
      weight: 50

# -----------------------------------------------------------------------------
# Markup & rendering
# -----------------------------------------------------------------------------
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - [ "\\[", "\\]" ]
            - [ "$$", "$$" ]
          inline:
            - [ "\\(", "\\)" ]
            - [ "$", "$" ]
            
  highlight:
    codeFences: true
    guessSyntax: true
    style: monokai
    noClasses: false               # Let PaperMod's bundled Chroma styles handle tokens
    tabWidth: 4
